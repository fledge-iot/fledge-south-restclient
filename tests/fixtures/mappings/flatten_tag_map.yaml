# Same site tree as flatten_hierarchy, but a read tag map selects three
# flattened keys and routes them to tank / pump assets.

source:
  records: "value"

tags:
  - name: "SITE-A_Line1_Tank01_Readings_Level"
    asset: "tank-01"
    datapoint: "level"
  - name: "SITE-A_Line1_Tank01_Readings_Temperature"
    asset: "tank-01"
    datapoint: "temperature"
  - name: "SITE-A_Line2_Pump02_Readings_FlowRate"
    asset: "pump-02"
    datapoint: "flow_rate"

extractions:
  - asset: "unmapped"
    timestamp: "LastUpdated"
    from: "flatten(from_json(Data), ['SiteId', 'LineId', 'EquipmentId'])"
