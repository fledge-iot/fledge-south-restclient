[project]
name = "restclient-playground"
version = "3.1.0"
description = "Local JMESPath playground for the fledge-south-restclient plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jmespath>=1.0,<2",
    "PyYAML>=6.0.1,<7",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
