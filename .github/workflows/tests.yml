##
## CI: unit tests, then the integration tests against the local fake server.
## No external services are needed.
##
name: tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Fledge's Python packages target 3.9 through 3.12.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r python/requirements-restclient.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Run integration tests
        run: python -m pytest tests/integration -q -m integration
